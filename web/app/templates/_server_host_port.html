{# Expects host_ip, admin_port, host_ip_name, port_name #}
<label>IPv4 address
  <input
    type="text"
    name="{{ host_ip_name }}"
    value="{{ host_ip }}"
    inputmode="decimal"
    autocomplete="off"
    placeholder="192.168.0.10"
    pattern="^\d{1,3}(\.\d{1,3}){3}$"
    maxlength="15"
    required
    title="IPv4 address, for example 192.168.0.10"
  >
</label>
<label>Port
  <input
    type="number"
    name="{{ port_name }}"
    value="{{ admin_port }}"
    min="1"
    max="65535"
    step="1"
    required
    title="Admin UI port, usually 3000"
  >
</label>
<p class="muted small">Connections use <code>http://</code> to this IP and port (AdGuard Home admin UI, not DNS port 53).</p>
