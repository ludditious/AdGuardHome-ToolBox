{% extends "base.html" %}
{% block title %} — Recover password{% endblock %}
{% block content %}
<section class="card">
  <h1>Recover password</h1>
  <p class="muted">Use the security answers saved under Settings → Account.</p>
  {% if error %}<p class="notice notice-err">{{ error }}</p>{% endif %}
  {% if success %}<p class="notice notice-ok">{{ success }}</p>{% endif %}
  <form method="post" action="/recover">
    <label>Username<input type="text" name="username" required autocomplete="username"></label>
    <label>{{ security_questions[0] }}<input type="text" name="answer_1" required autocomplete="off"></label>
    <label>{{ security_questions[1] }}<input type="text" name="answer_2" required autocomplete="off"></label>
    <label>{{ security_questions[2] }}<input type="text" name="answer_3" required autocomplete="off"></label>
    <label>New password<input type="password" name="new_password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm new password<input type="password" name="confirm_password" required minlength="8" autocomplete="new-password"></label>
    <button type="submit">Reset password</button>
  </form>
  <p class="muted"><a href="/login">Back to sign in</a></p>
</section>
{% endblock %}
