services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: adguardhome-toolbox:latest
    container_name: adguardhome-toolbox
    ports:
      - "8080:8080"
    environment:
      ALLOW_REGISTRATION: "true"
      DATABASE_URL: sqlite:////data/aghomesync.db
    volumes:
      - agh-web-data:/data
    restart: unless-stopped

volumes:
  agh-web-data:
